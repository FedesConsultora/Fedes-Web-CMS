<script>
const baseShowDashboard=showDashboard;
showDashboard=async function(){
  await baseShowDashboard();
  if(state.view!=='dashboard')return;
  try{
    const insights=await call('adminGetInsights',[state.token]);
    appendDashboardInsights(insights);
  }catch(err){toast('No se pudieron cargar los insights: '+err.message,'error');}
};

function appendDashboardInsights(r){
  const host=content.querySelector('.section-grid');
  if(!host)return;
  host.insertAdjacentHTML('beforeend',`
    <section class="panel col-6">
      <div class="panel-head"><div><h3>Analítica web · últimos 30 días</h3><p>${esc(r.analytics.last30)} eventos recientes de ${esc(r.analytics.total)} históricos.</p></div><button class="panel-link" data-insight-table="analytics">Abrir analítica →</button></div>
      <div class="tabs"><button class="tab active" data-insight-tab="pages">Páginas</button><button class="tab" data-insight-tab="sources">Fuentes</button><button class="tab" data-insight-tab="categories">Categorías</button></div>
      <div id="insightDistribution">${listDistribution(r.analytics.topPages)}</div>
    </section>
    <section class="panel col-6">
      <div class="panel-head"><div><h3>CRM · distribución global</h3><p>Lectura transversal, independiente de una campaña puntual.</p></div><button class="panel-link" data-insight-table="leads">Abrir leads →</button></div>
      <div class="tabs"><button class="tab active" data-crm-tab="stage">Etapas</button><button class="tab" data-crm-tab="class">Clasificación</button><button class="tab" data-crm-tab="meeting">Reuniones</button></div>
      <div id="crmDistribution">${listDistribution(r.crm.leadStages)}</div>
    </section>
    <section class="panel col-7">
      <div class="panel-head"><div><h3>Salud del CMS</h3><p>Estado editorial del sitio y recursos administrables.</p></div></div>
      <div class="table-shell"><table class="data-table"><thead><tr><th>Entidad</th><th>Total</th><th>Publicados</th><th>Borradores</th><th>Ocultos</th><th></th></tr></thead><tbody>${cmsHealthRows(r.cms)}</tbody></table></div>
    </section>
    <section class="panel col-5">
      <div class="panel-head"><div><h3>Calidad de datos</h3><p>Huecos que conviene revisar para mantener una base útil.</p></div></div>
      <div class="attention-list">${qualityRows(r.quality)}</div>
    </section>`);

  $$('[data-insight-table]').forEach(b=>b.onclick=()=>showTable(b.dataset.insightTable));
  const analyticsMaps={pages:r.analytics.topPages,sources:r.analytics.topSources,categories:r.analytics.categories};
  $$('[data-insight-tab]').forEach(b=>b.onclick=()=>{$$('[data-insight-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#insightDistribution').innerHTML=listDistribution(analyticsMaps[b.dataset.insightTab]);});
  const crmMaps={stage:r.crm.leadStages,class:r.crm.leadClassifications,meeting:r.crm.meetingStatuses};
  $$('[data-crm-tab]').forEach(b=>b.onclick=()=>{$$('[data-crm-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('#crmDistribution').innerHTML=listDistribution(crmMaps[b.dataset.crmTab]);});
}

function listDistribution(rows){
  if(!rows||!rows.length)return empty('Sin datos','Todavía no hay información suficiente.');
  const max=Math.max(...rows.map(x=>x.count),1);
  return `<div class="distribution">${rows.map(x=>`<div class="distribution-row"><label title="${attr(x.key)}">${esc(x.key)}</label><div class="bar"><i style="width:${Math.round(x.count/max*100)}%"></i></div><b>${x.count}</b></div>`).join('')}</div>`;
}
function cmsHealthRows(cms){
  const map=[['blog','Blog y Recursos','blog'],['content','Contenido Web','content'],['media','Media','media'],['cases','Casos de éxito','cases'],['team','Equipo','team'],['testimonials','Testimonios','testimonials']];
  return map.map(([key,label,table])=>{const x=cms[key]||{};return `<tr><td class="cell-main">${esc(label)}</td><td>${x.total||0}</td><td>${x.published||0}</td><td>${x.draft||0}</td><td>${x.hidden||0}</td><td><button class="btn small" data-insight-table="${table}">Abrir</button></td></tr>`;}).join('');
}
function qualityRows(q){
  const rows=[
    ['Leads sin email',q.leadsMissingEmail,'leads'],['Leads sin empresa',q.leadsMissingCompany,'leads'],['Leads sin origen',q.leadsMissingSource,'leads'],
    ['Onboardings sin email',q.onboardingMissingEmail,'onboarding'],['Onboardings sin empresa',q.onboardingMissingCompany,'onboarding'],['Posts sin contenido',q.blogMissingContent,'blog'],
    ['Media sin alt text',q.mediaMissingAlt,'media'],['Mailings fallidos',q.failedMailings,'leadMailings']
  ];
  return rows.map(([label,count,table])=>`<div class="attention-item"><div><b>${esc(label)}</b><span>${count?`${count} registro(s) para revisar`:'Sin observaciones'}</span></div><button class="btn small ${count?'':'success'}" data-insight-table="${table}">${count||'✓'}</button></div>`).join('');
}
</script>
