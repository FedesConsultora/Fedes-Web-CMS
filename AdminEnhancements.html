<style>
.toolbar-main{grid-template-columns:minmax(220px,1fr) repeat(3,auto)}
@media(max-width:850px){.toolbar-main{grid-template-columns:1fr auto auto}.toolbar-main #exportCsv{grid-column:auto}}
@media(max-width:560px){.toolbar-main{grid-template-columns:1fr 1fr}.toolbar-main .search-box{grid-column:1/-1}.toolbar-main .btn{width:100%}}
</style>
<script>
const SAFE_DUPLICATE_TABLES=new Set(['settings','content','modules','cases','testimonials','team','blog','gallery','campaigns']);

const originalFiltersHtml=filtersHtml;
filtersHtml=function(def,r){
  const base=originalFiltersHtml(def,r);
  const sortFields=def.fields.filter(f=>!['json','textarea'].includes(f.type));
  const controls=`<div class="filter-control"><label>Ordenar por</label><select id="sortBy"><option value="">Predeterminado</option>${sortFields.map(f=>`<option value="${attr(f.name)}" ${state.query.sortBy===f.name?'selected':''}>${esc(f.label)}</option>`).join('')}</select></div><div class="filter-control"><label>Dirección</label><select id="sortDir"><option value="desc" ${state.query.sortDir!=='asc'?'selected':''}>Descendente</option><option value="asc" ${state.query.sortDir==='asc'?'selected':''}>Ascendente</option></select></div>`;
  return base.replace('<div class="filter-actions">',controls+'<div class="filter-actions">');
};

rowHtml=function(def,row,cols){
  const id=row[def.pk],archived=!isBlank(row.archived_at),canSelect=def.permissions.deleteMode!=='none';
  const duplicate=def.permissions.create&&SAFE_DUPLICATE_TABLES.has(def.key)?`<button class="btn small" data-action="duplicate" data-id="${attr(id)}">Duplicar</button>`:'';
  return `<tr data-row-id="${attr(id)}"><td class="check-cell">${canSelect?`<input class="row-check" type="checkbox" value="${attr(id)}" ${state.selected.has(String(id))?'checked':''}>`:''}</td>${cols.map((c,i)=>`<td class="${i===0?'cell-main':''}">${cellValue(c,row[c])}</td>`).join('')}<td><div class="row-actions"><button class="btn small" data-action="view" data-id="${attr(id)}">Consulta</button>${def.permissions.write?`<button class="btn small" data-action="edit" data-id="${attr(id)}">Modificar</button>`:''}${duplicate}${def.permissions.deleteMode==='archive'?(archived?`<button class="btn small success" data-action="restore" data-id="${attr(id)}">Restaurar</button>`:`<button class="btn small danger" data-action="archive" data-id="${attr(id)}">Baja</button>`):''}${def.permissions.deleteMode==='hard'?`<button class="btn small danger" data-action="delete" data-id="${attr(id)}">Eliminar</button>`:''}</div></td></tr>`;
};

handleRowAction=async function(def,action,id){
  const row=state.result.rows.find(r=>String(r[def.pk])===String(id));
  if(action==='view')return viewRecord(def,row);
  if(action==='edit')return openEditor(row);
  if(action==='duplicate')return mutate(()=>call('adminDuplicateDataSafe',[state.token,def.key,id]),'Registro duplicado');
  if(action==='archive')return confirmMutation('Dar de baja este registro?',()=>call('adminArchiveData',[state.token,def.key,id]),'Registro dado de baja');
  if(action==='restore')return mutate(()=>call('adminRestoreDataSafe',[state.token,def.key,id]),'Registro restaurado');
  if(action==='delete')return confirmMutation('Esta baja es definitiva. ¿Eliminar el registro?',()=>call('adminHardDeleteData',[state.token,def.key,id]),'Registro eliminado');
};

bulkAction=async function(def,action){
  const ids=Array.from(state.selected);if(!ids.length)return;
  if(!confirm(`Aplicar “${action}” a ${ids.length} registros?`))return;
  busy(true);
  try{const r=await call('adminBulkActionSafe',[state.token,def.key,ids,action]);const failed=(r.results||[]).filter(x=>!x.success);state.selected.clear();if(failed.length)toast(`Operación terminada con ${failed.length} error(es)`,'error');else toast('Operación masiva completada');await showTable(def.key,true);}catch(err){toast(err.message,'error');}finally{busy(false);}
};

bindTable=function(def,r){
  $('#toggleFilters').onclick=()=>{state.filtersOpen=!state.filtersOpen;$('#filtersPanel').classList.toggle('hidden',!state.filtersOpen);};
  const search=()=>{state.query.search=$('#tableSearch').value.trim();state.query.page=1;showTable(def.key,true);};
  $('#applySearch').onclick=search;$('#tableSearch').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
  $('#applyFilters')?.addEventListener('click',()=>{state.query.filters={};$$('[data-filter]').forEach(s=>{if(s.value)state.query.filters[s.dataset.filter]=s.value;});state.query.dateFrom=$('#dateFrom')?.value||'';state.query.dateTo=$('#dateTo')?.value||'';state.query.includeArchived=$('#includeArchived')?.value==='true';state.query.sortBy=$('#sortBy')?.value||'';state.query.sortDir=$('#sortDir')?.value||'desc';state.query.page=1;showTable(def.key,true);});
  $('#clearFilters')?.addEventListener('click',()=>{const searchText=state.query.search;resetQuery();state.query.search=searchText;showTable(def.key,true);});
  $('#pageSize').onchange=e=>{state.query.pageSize=Number(e.target.value);state.query.page=1;showTable(def.key,true);};
  $('#prevPage').onclick=()=>{if(state.query.page>1){state.query.page--;showTable(def.key,true);}};
  $('#nextPage').onclick=()=>{if(state.query.page<r.pages){state.query.page++;showTable(def.key,true);}};
  if($('#checkAll'))$('#checkAll').onchange=e=>{$$('.row-check').forEach(ch=>{ch.checked=e.target.checked;if(ch.checked)state.selected.add(ch.value);else state.selected.delete(ch.value);});updateBulk();};
  $$('.row-check').forEach(ch=>ch.onchange=()=>{ch.checked?state.selected.add(ch.value):state.selected.delete(ch.value);updateBulk();});
  $$('[data-action]').forEach(b=>b.onclick=()=>handleRowAction(def,b.dataset.action,b.dataset.id));
  $$('[data-bulk]').forEach(b=>b.onclick=()=>bulkAction(def,b.dataset.bulk));
  addExportButton(def);
};

function addExportButton(def){
  const toolbar=$('.toolbar-main');if(!toolbar||$('#exportCsv'))return;
  const btn=document.createElement('button');btn.id='exportCsv';btn.className='btn ghost';btn.textContent='⇩ Exportar CSV';btn.onclick=()=>exportFilteredCsv(def);toolbar.appendChild(btn);
}

async function exportFilteredCsv(def){
  busy(true);
  try{
    const q={...state.query,filters:{...state.query.filters},page:1,pageSize:200};
    let first=await call('adminQueryTable',[state.token,def.key,q]);
    let rows=[...first.rows];
    for(let p=2;p<=first.pages;p++){q.page=p;const part=await call('adminQueryTable',[state.token,def.key,q]);rows.push(...part.rows);}
    const fields=def.fields.map(f=>f.name);
    const csv=[fields.map(csvCell).join(',')].concat(rows.map(row=>fields.map(f=>csvCell(row[f])).join(','))).join('\r\n');
    const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`fedes-${def.key}-${new Date().toISOString().slice(0,10)}.csv`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast(`${rows.length} registros exportados`);
  }catch(err){toast(err.message,'error');}finally{busy(false);}
}
function csvCell(v){let s;if(v===null||v===undefined)s='';else if(typeof v==='object')s=JSON.stringify(v);else s=String(v);return `"${s.replace(/"/g,'""')}"`;}
</script>
