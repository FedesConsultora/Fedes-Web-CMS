<script>
const state={token:sessionStorage.getItem('fedes_cms_token')||'',schema:null,entity:null,view:'dashboard',rows:[],media:[]};
const $=s=>document.querySelector(s), content=$('#content');
function call(name,args=[]){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||e)));runner[name](...args);});}
async function boot(){if(!state.token)return;try{state.schema=await call('adminGetUiSchema',[state.token]);showApp();buildNav();await showDashboard();}catch(e){sessionStorage.removeItem('fedes_cms_token');state.token='';}}
function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden')}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';try{const r=await call('adminLogin',[$('#password').value]);if(!r.success)throw new Error(r.error);state.token=r.token;sessionStorage.setItem('fedes_cms_token',r.token);await boot();}catch(err){$('#loginError').textContent=err.message}});
$('#logoutBtn').onclick=async()=>{try{await call('adminLogout',[state.token])}catch(e){}sessionStorage.removeItem('fedes_cms_token');location.reload()};
function buildNav(){const box=$('#entityNav');box.innerHTML='';Object.entries(state.schema.entities).forEach(([key,def])=>{const b=document.createElement('button');b.className='nav';b.textContent=def.label;b.onclick=()=>showEntity(key);box.appendChild(b)});document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{const v=b.dataset.view;if(v==='dashboard')showDashboard();if(v==='leads')showLeads();if(v==='media')showMedia();if(v==='audit')showAudit()})}
function activate(label,subtitle=''){document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));$('#viewTitle').textContent=label;$('#viewSubtitle').textContent=subtitle;$('#newBtn').classList.add('hidden')}
async function showDashboard(){state.view='dashboard';activate('Dashboard');const r=await call('adminGetDashboard',[state.token]);content.innerHTML=`<div class="stats">${[['Leads',r.stats.leads],['Calificados',r.stats.qualified],['Incompletos',r.stats.incomplete],['Contactos',r.stats.contacts],['Onboardings',r.stats.onboardings]].map(x=>`<div class="card stat"><strong>${x[1]}</strong><span>${x[0]}</span></div>`).join('')}</div><div class="card table-card"><table class="table"><thead><tr><th>Fecha</th><th>Empresa</th><th>Email</th><th>Estado</th><th>Clasificación</th><th>Score</th></tr></thead><tbody>${r.recentLeads.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.company)}</td><td>${esc(x.email)}</td><td>${esc(x.status)}</td><td>${esc(x.classification)}</td><td>${esc(x.score_total)}</td></tr>`).join('')}</tbody></table></div>`}
async function showEntity(entity){state.entity=entity;state.view='entity';const def=state.schema.entities[entity];activate(def.label);$('#newBtn').classList.remove('hidden');$('#newBtn').onclick=()=>openEditor({});state.rows=await call('adminList',[state.token,entity]);renderEntityTable(def)}
function renderEntityTable(def){const fields=def.fields.slice(0,5);content.innerHTML=`<div class="card table-card"><table class="table"><thead><tr>${fields.map(f=>`<th>${esc(f)}</th>`).join('')}<th>Estado</th><th>Acciones</th></tr></thead><tbody>${state.rows.map(r=>`<tr>${fields.map(f=>`<td>${short(r[f])}</td>`).join('')}<td><span class="badge ${esc(r.status)}">${esc(r.status||'')}</span></td><td><div class="actions"><button class="btn" onclick='editRecord(${JSON.stringify(r).replace(/'/g,"&#39;")})'>Editar</button><button class="btn" onclick='duplicateRecord("${escAttr(r[def.pk])}")'>Duplicar</button>${r.status==='archived'?`<button class="btn" onclick='restoreRecord("${escAttr(r[def.pk])}")'>Restaurar</button>`:`<button class="btn danger" onclick='archiveRecord("${escAttr(r[def.pk])}")'>Archivar</button>`}</div></td></tr>`).join('')}</tbody></table></div>`}
window.editRecord=r=>openEditor(r);window.archiveRecord=async id=>{await call('adminArchive',[state.token,state.entity,id]);showEntity(state.entity)};window.restoreRecord=async id=>{await call('adminRestore',[state.token,state.entity,id]);showEntity(state.entity)};window.duplicateRecord=async id=>{await call('adminDuplicate',[state.token,state.entity,id]);showEntity(state.entity)};
function openEditor(record){const def=state.schema.entities[state.entity], types=state.schema.fields[state.entity]||{};const inputs=def.fields.map(f=>fieldHtml(f,types[f]||'text',record[f])).join('');$('#modalBody').innerHTML=`<h2>${record[def.pk]?'Editar':'Nuevo'} ${esc(def.label)}</h2><form id="editForm"><div class="form-grid">${inputs}</div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Guardar</button></div></form>`;$('#modal').classList.remove('hidden');$('#editForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target),obj={};def.fields.forEach(f=>{const t=types[f];obj[f]=t==='boolean'?e.target.elements[f]?.checked:(fd.get(f)||'')});if(record[def.pk])obj[def.pk]=record[def.pk];await call('adminSave',[state.token,state.entity,obj]);closeModal();showEntity(state.entity)}}
function fieldHtml(name,type,value){const full=['textarea','json'].includes(type)?' full':'';if(type==='boolean')return `<div class="field${full}"><label>${esc(name)}</label><input name="${escAttr(name)}" type="checkbox" ${String(value)==='true'||value===true?'checked':''}></div>`;if(type==='status')return `<div class="field"><label>${esc(name)}</label><select name="${escAttr(name)}">${state.schema.statusOptions.map(s=>`<option ${s===value?'selected':''}>${s}</option>`).join('')}</select></div>`;if(type==='textarea'||type==='json')return `<div class="field${full}"><label>${esc(name)}</label><textarea name="${escAttr(name)}">${esc(value)}</textarea></div>`;const htmlType=type==='number'?'number':type==='url'?'url':type==='datetime'?'datetime-local':'text';return `<div class="field${full}"><label>${esc(name)}</label><input name="${escAttr(name)}" type="${htmlType}" value="${escAttr(formatInput(value,type))}"></div>`}
function formatInput(v,t){if(t==='datetime'&&v)return String(v).slice(0,16);return v??''}
async function showLeads(){activate('Leads','CRM y campaña Galicia');const rows=await call('adminListLeads',[state.token]);content.innerHTML=`<div class="card table-card"><table class="table"><thead><tr><th>Fecha</th><th>Campaña</th><th>Origen</th><th>Empresa</th><th>Email</th><th>Estado</th><th>Score</th><th>Clasificación</th><th>Mailing</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.campaign_key)}</td><td>${esc(x.source)}</td><td>${esc(x.company)}</td><td>${esc(x.email)}</td><td>${esc(x.status)}</td><td>${esc(x.score_total)}</td><td>${esc(x.classification)}</td><td>${esc(x.mailing_segment)}</td></tr>`).join('')}</tbody></table></div>`}
async function showMedia(){activate('Media');const rows=await call('adminListMedia',[state.token]);state.media=rows;content.innerHTML=`<div class="upload-box"><b>Subir imagen</b><p><input id="mediaFile" type="file" accept="image/*"> <input id="mediaAlt" placeholder="Alt text"> <button id="uploadBtn" class="primary">Subir</button></p><small>Se guarda automáticamente en la carpeta Drive del CMS.</small></div><div class="media-grid">${rows.map(x=>`<div class="media-item"><img src="${escAttr(x.public_url)}" alt="${escAttr(x.alt_text)}"><div><b>${esc(x.file_name)}</b><br>${esc(x.media_id)}<br>${esc(x.alt_text)}</div></div>`).join('')}</div>`;$('#uploadBtn').onclick=uploadMedia}
async function uploadMedia(){const f=$('#mediaFile').files[0];if(!f)return alert('Elegí una imagen');const base64=await fileToDataUrl(f);await call('uploadMediaAdmin',[state.token,{fileName:f.name,mimeType:f.type,base64,altText:$('#mediaAlt').value}]);showMedia()}
function fileToDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
async function showAudit(){activate('Historial','Últimos 200 cambios');const rows=await call('adminListAudit',[state.token]);content.innerHTML=`<div class="card table-card"><table class="table"><thead><tr><th>Fecha</th><th>Actor</th><th>Entidad</th><th>Acción</th><th>ID</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.actor)}</td><td>${esc(x.entity)}</td><td>${esc(x.action)}</td><td>${esc(x.entity_id)}</td></tr>`).join('')}</tbody></table></div>`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escAttr(v){return esc(v)}function short(v){const s=String(v??'');return esc(s.length>120?s.slice(0,117)+'…':s)}function closeModal(){$('#modal').classList.add('hidden')}window.closeModal=closeModal;$('#modalClose').onclick=closeModal;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};boot();
</script>
