<script>
const state={
  token:sessionStorage.getItem('fedes_cms_token')||'',workspace:null,view:'dashboard',tableKey:null,result:null,
  query:{search:'',filters:{},dateFrom:'',dateTo:'',includeArchived:false,page:1,pageSize:50,sortBy:'',sortDir:'desc'},selected:new Set(),filtersOpen:false
};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const content=$('#content');

function call(name,args=[]){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e&&e.message?e.message:String(e))));runner[name](...args);});}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function attr(v){return esc(v);}
function human(v){return String(v||'').replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());}
function short(v,n=90){const s=String(v??'');return esc(s.length>n?s.slice(0,n-1)+'…':s);}
function isBlank(v){return v===undefined||v===null||String(v)==='';}
function fmtDate(v){if(!v)return '—';const d=new Date(v);if(Number.isNaN(d.getTime()))return short(v,35);return d.toLocaleString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}
function fmtNumber(v){const n=Number(v);return Number.isFinite(n)?new Intl.NumberFormat('es-AR').format(n):esc(v);}
function badge(v){const s=String(v??'');return s?`<span class="badge ${attr(s)}">${esc(s)}</span>`:'<span class="cell-muted">—</span>';}
function toast(message,type='success'){const el=document.createElement('div');el.className=`toast ${type}`;el.textContent=message;$('#toastStack').appendChild(el);setTimeout(()=>el.remove(),3600);}
function busy(on){$('#loadingOverlay').classList.toggle('hidden',!on);}
function closeModal(){$('#modal').classList.add('hidden');$('#modal').setAttribute('aria-hidden','true');$('#modalBody').innerHTML='';}
function openModal(html,wide=false){$('#modalBody').innerHTML=html;$('.modal-panel').classList.toggle('wide-panel',wide);$('#modal').classList.remove('hidden');$('#modal').setAttribute('aria-hidden','false');}
$('#modalClose').onclick=closeModal;$$('[data-close-modal]').forEach(x=>x.onclick=closeModal);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

async function boot(){
  if(!state.token)return;
  try{
    state.workspace=await call('adminGetWorkspace',[state.token]);
    $('#appVersion').textContent=`v${state.workspace.app.version} · DB ${state.workspace.app.schemaVersion}`;
    showApp();buildNav();await showDashboard();
  }catch(err){sessionStorage.removeItem('fedes_cms_token');state.token='';toast(err.message,'error');}
}
function showApp(){$('#loginView').classList.add('hidden');$('#appView').classList.remove('hidden');}
$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();$('#loginError').textContent='';busy(true);try{const r=await call('adminLogin',[$('#password').value]);if(!r.success)throw new Error(r.error||'No se pudo iniciar sesión');state.token=r.token;sessionStorage.setItem('fedes_cms_token',r.token);await boot();}catch(err){$('#loginError').textContent=err.message;}finally{busy(false);}});
$('#logoutBtn').onclick=async()=>{try{await call('adminLogout',[state.token]);}catch(e){}sessionStorage.removeItem('fedes_cms_token');location.reload();};
$('#refreshBtn').onclick=()=>state.view==='dashboard'?showDashboard():showTable(state.tableKey,true);

function buildNav(){
  const groups=$('#navGroups');groups.innerHTML='';
  state.workspace.groups.forEach(group=>{
    const defs=Object.values(state.workspace.tables).filter(t=>t.group===group);
    if(!defs.length)return;
    const wrap=document.createElement('section');wrap.className='nav-group';wrap.innerHTML=`<div class="nav-group-title">${esc(group)}</div>`;
    defs.forEach(def=>{const b=document.createElement('button');b.className='nav-item';b.dataset.table=def.key;b.innerHTML=`<span class="nav-icon">${def.icon||'•'}</span><span>${esc(def.label)}</span>`;b.onclick=()=>showTable(def.key);wrap.appendChild(b);});groups.appendChild(wrap);
  });
  $('[data-view="dashboard"]').onclick=showDashboard;
}
function setActive(target){$$('.nav-item').forEach(x=>x.classList.remove('active'));if(target==='dashboard')$('[data-view="dashboard"]').classList.add('active');else $(`[data-table="${target}"]`)?.classList.add('active');}
function setHeader(title,subtitle,target){$('#viewTitle').textContent=title;$('#viewSubtitle').textContent=subtitle||'';$('#breadcrumb').textContent=`Fedes / ${title}`;setActive(target);}
function resetQuery(){state.query={search:'',filters:{},dateFrom:'',dateTo:'',includeArchived:false,page:1,pageSize:50,sortBy:'',sortDir:'desc'};state.selected=new Set();state.filtersOpen=false;}

async function showDashboard(){
  state.view='dashboard';state.tableKey=null;setHeader('Inicio','Visión consolidada del CRM, campañas, onboarding, contenidos y actividad.','dashboard');$('#newBtn').classList.add('hidden');busy(true);
  try{const r=await call('adminGetDashboardV2',[state.token]);renderDashboard(r);}catch(err){content.innerHTML=errorState(err);toast(err.message,'error');}finally{busy(false);}
}
function renderDashboard(r){
  const s=r.stats;
  content.innerHTML=`
    <div class="stats-grid">
      ${statCard('Leads',s.leads,'Base comercial','stat-blue')}${statCard('Completos',s.complete,'Formularios finalizados','stat-green')}${statCard('Incompletos',s.incomplete,'Requieren seguimiento','stat-amber')}${statCard('Campañas',s.campaigns,'Históricas + activas','stat-purple')}
      ${statCard('Contactos',s.contacts,'Consultas generales','stat-cyan')}${statCard('Onboardings',s.onboardings,`${s.onboardingCompleted} completados`,'stat-green')}${statCard('Mailings pendientes',s.mailingsPending,'Pendientes / programados','stat-amber')}${statCard('Conversión',s.leads?Math.round(s.complete*1000/s.leads)/10+'%':'0%','Global de leads','stat-blue')}
    </div>
    <div class="section-grid">
      <section class="panel col-8"><div class="panel-head"><div><h3>Campañas</h3><p>Galicia es una campaña dentro del ecosistema general.</p></div><button class="panel-link" data-go-table="campaigns">Ver todas →</button></div>${campaignCards(r.campaigns)}</section>
      <section class="panel col-4"><div class="panel-head"><div><h3>Necesitan atención</h3><p>Incompletos de +24 h o revisión manual pendiente.</p></div></div>${attentionList(r.attention)}</section>
      <section class="panel col-7"><div class="panel-head"><div><h3>Leads recientes</h3><p>Últimos ingresos de todas las campañas.</p></div><button class="panel-link" data-go-table="leads">Abrir CRM →</button></div>${simpleLeadTable(r.recentLeads)}</section>
      <section class="panel col-5"><div class="panel-head"><div><h3>Actividad administrativa</h3><p>Últimos cambios auditados.</p></div><button class="panel-link" data-go-table="audit">Historial →</button></div>${auditList(r.recentAudit)}</section>
    </div>`;
  $$('[data-go-table]').forEach(b=>b.onclick=()=>showTable(b.dataset.goTable));
  $$('[data-campaign360]').forEach(b=>b.onclick=()=>openCampaign360(b.dataset.campaign360));
  $$('[data-lead360]').forEach(b=>b.onclick=()=>openLead360(b.dataset.lead360));
}
function statCard(label,value,sub,cls){return `<div class="stat-card ${cls}"><div class="stat-kicker">${esc(label)}</div><strong>${esc(value)}</strong><small>${esc(sub)}</small></div>`;}
function campaignCards(rows){if(!rows.length)return empty('No hay campañas','Creá la primera campaña desde CRM / Campañas.');return `<div class="table-shell"><table class="data-table"><thead><tr><th>Campaña</th><th>Estado</th><th>Leads</th><th>Completos</th><th>Incompletos</th><th>Conversión</th><th></th></tr></thead><tbody>${rows.map(c=>`<tr><td><div class="cell-main">${esc(c.name||c.campaign_key)}</div><div class="cell-muted">${esc(c.campaign_key)}</div></td><td>${badge(c.status)}</td><td>${fmtNumber(c.total)}</td><td>${fmtNumber(c.complete)}</td><td>${fmtNumber(c.incomplete)}</td><td>${esc(c.conversion)}%</td><td><button class="btn small" data-campaign360="${attr(c.campaign_key)}">360°</button></td></tr>`).join('')}</tbody></table></div>`;}
function attentionList(rows){if(!rows.length)return empty('Todo al día','No hay leads marcados para atención.');return `<div class="attention-list">${rows.map(x=>`<div class="attention-item"><div><b>${esc(x.company||x.full_name||x.email||'Lead')}</b><span>${esc(x.status)} · ${fmtDate(x.last_activity_at||x.updated_at)}</span></div><button class="btn small" data-lead360="${attr(x.lead_id)}">Ver</button></div>`).join('')}</div>`;}
function auditList(rows){if(!rows.length)return empty('Sin actividad','Todavía no hay cambios auditados.');return `<div class="activity-list">${rows.map(x=>`<div class="activity-item"><div><b>${esc(x.action)} · ${esc(x.entity)}</b><span>${esc(x.actor||'admin')} · ${short(x.entity_id,28)}</span></div><div class="activity-meta"><span>${fmtDate(x.created_at)}</span></div></div>`).join('')}</div>`;}
function simpleLeadTable(rows){if(!rows.length)return empty('Sin leads','Todavía no hay registros comerciales.');return `<div class="table-shell"><table class="data-table"><thead><tr><th>Persona / empresa</th><th>Campaña</th><th>Origen</th><th>Estado</th><th>Clasificación</th><th>Actividad</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr><td><div class="cell-main">${esc(x.company||x.full_name||'—')}</div><div class="cell-muted">${esc(x.email||'')}</div></td><td>${esc(x.campaign_key||'—')}</td><td>${esc(x.source||'—')}</td><td>${badge(x.status)}</td><td>${badge(x.classification)}</td><td>${fmtDate(x.last_activity_at||x.created_at)}</td><td><button class="btn small" data-lead360="${attr(x.lead_id)}">360°</button></td></tr>`).join('')}</tbody></table></div>`;}

async function showTable(key,preserve=false){
  const def=state.workspace.tables[key];if(!def)return;
  state.view='table';state.tableKey=key;if(!preserve)resetQuery();setHeader(def.label,tableSubtitle(def),key);
  configureNewButton(def);busy(true);
  try{state.result=await call('adminQueryTable',[state.token,key,state.query]);renderTable(def,state.result);}catch(err){content.innerHTML=errorState(err);toast(err.message,'error');}finally{busy(false);}
}
function tableSubtitle(def){if(def.key==='campaigns')return 'Alta, baja, modificación y consulta de campañas. Galicia convive con todas las demás.';if(def.key==='leads')return 'CRM consolidado con scoring, atribución, seguimiento, reuniones y mailings.';if(def.key==='onboarding')return 'Legajos completos de onboarding de clientes.';if(def.readOnly)return 'Consulta integral. Esta tabla se mantiene de solo lectura por integridad del sistema.';return 'Alta, baja, modificación y consulta con filtros avanzados.';}
function configureNewButton(def){const b=$('#newBtn');if(def.key==='media'){b.textContent='＋ Subir media';b.classList.remove('hidden');b.onclick=openMediaUpload;return;}if(def.permissions.create){b.textContent='＋ Alta';b.classList.remove('hidden');b.onclick=()=>openEditor({});}else b.classList.add('hidden');}
function renderTable(def,r){
  const cols=def.listColumns;
  content.innerHTML=`
    <div class="toolbar">
      <div class="toolbar-main">
        <div class="search-box"><input id="tableSearch" value="${attr(state.query.search)}" placeholder="Buscar en ${attr(def.label.toLowerCase())}…"></div>
        <button id="toggleFilters" class="btn ghost filter-toggle">⚙ Filtros ${activeFilterCount()?`(${activeFilterCount()})`:''}</button>
        <button id="applySearch" class="btn primary">Buscar</button>
      </div>
      <div id="filtersPanel" class="filters-panel ${state.filtersOpen?'':'hidden'}">${filtersHtml(def,r)}</div>
    </div>
    <div id="bulkBar" class="bulk-bar ${state.selected.size?'':'hidden'}"><span><b id="selectedCount">${state.selected.size}</b> seleccionados</span><div class="bulk-actions">${def.permissions.deleteMode==='archive'?'<button class="btn small danger" data-bulk="archive">Dar de baja</button><button class="btn small success" data-bulk="restore">Restaurar</button>':''}${def.permissions.deleteMode==='hard'?'<button class="btn small danger" data-bulk="delete">Eliminar</button>':''}</div></div>
    <div class="table-shell"><table class="data-table"><thead><tr><th class="check-cell"><input id="checkAll" type="checkbox"></th>${cols.map(c=>`<th>${esc(fieldLabel(def,c))}</th>`).join('')}<th>Acciones</th></tr></thead><tbody>${r.rows.length?r.rows.map(row=>rowHtml(def,row,cols)).join(''):`<tr><td colspan="${cols.length+2}">${empty('Sin resultados','Probá quitando filtros o creando un nuevo registro.')}</td></tr>`}</tbody></table></div>
    <div class="pagination"><div>Mostrando ${r.total?((r.page-1)*r.pageSize+1):0}–${Math.min(r.page*r.pageSize,r.total)} de <b>${r.total}</b></div><div class="pagination-actions"><select id="pageSize" class="btn small"><option ${r.pageSize===25?'selected':''}>25</option><option ${r.pageSize===50?'selected':''}>50</option><option ${r.pageSize===100?'selected':''}>100</option><option ${r.pageSize===200?'selected':''}>200</option></select><button class="btn small" id="prevPage" ${r.page<=1?'disabled':''}>←</button><span>${r.page} / ${r.pages}</span><button class="btn small" id="nextPage" ${r.page>=r.pages?'disabled':''}>→</button></div></div>`;
  bindTable(def,r);
}
function fieldLabel(def,name){return def.fields.find(f=>f.name===name)?.label||human(name);}
function filtersHtml(def,r){
  const controls=def.filterFields.map(f=>{const vals=r.facets[f]||[];return `<div class="filter-control"><label>${esc(fieldLabel(def,f))}</label><select data-filter="${attr(f)}"><option value="">Todos</option>${vals.map(v=>`<option value="${attr(v)}" ${String(state.query.filters[f]||'')===String(v)?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`;}).join('');
  return `${controls}<div class="filter-control"><label>Desde</label><input id="dateFrom" type="date" value="${attr(state.query.dateFrom)}"></div><div class="filter-control"><label>Hasta</label><input id="dateTo" type="date" value="${attr(state.query.dateTo)}"></div>${def.fields.some(f=>f.name==='archived_at')?`<div class="filter-control"><label>Histórico</label><select id="includeArchived"><option value="false" ${!state.query.includeArchived?'selected':''}>Sólo activos</option><option value="true" ${state.query.includeArchived?'selected':''}>Incluir bajas</option></select></div>`:''}<div class="filter-actions"><button id="clearFilters" class="btn small">Limpiar</button><button id="applyFilters" class="btn small primary">Aplicar</button></div>`;
}
function activeFilterCount(){return Object.values(state.query.filters).filter(v=>String(v||'')!=='').length+(state.query.dateFrom?1:0)+(state.query.dateTo?1:0)+(state.query.includeArchived?1:0);}
function rowHtml(def,row,cols){const id=row[def.pk];const archived=!isBlank(row.archived_at);return `<tr data-row-id="${attr(id)}"><td class="check-cell"><input class="row-check" type="checkbox" value="${attr(id)}" ${state.selected.has(String(id))?'checked':''}></td>${cols.map((c,i)=>`<td class="${i===0?'cell-main':''}">${cellValue(c,row[c])}</td>`).join('')}<td><div class="row-actions"><button class="btn small" data-action="view" data-id="${attr(id)}">Consulta</button>${def.permissions.write?`<button class="btn small" data-action="edit" data-id="${attr(id)}">Modificar</button>`:''}${def.permissions.create&&def.key!=='media'?`<button class="btn small" data-action="duplicate" data-id="${attr(id)}">Duplicar</button>`:''}${def.permissions.deleteMode==='archive'?(archived?`<button class="btn small success" data-action="restore" data-id="${attr(id)}">Restaurar</button>`:`<button class="btn small danger" data-action="archive" data-id="${attr(id)}">Baja</button>`):''}${def.permissions.deleteMode==='hard'?`<button class="btn small danger" data-action="delete" data-id="${attr(id)}">Eliminar</button>`:''}</div></td></tr>`;}
function cellValue(name,v){if(name==='status'||['classification','mailing_segment','manual_review_status','meeting_status'].includes(name))return badge(v);if(/_at$/.test(name)||['starts_at','ends_at','published_at'].includes(name))return fmtDate(v);if(['score','score_total','sort_order','current_step','sequence_no','attempt_count','file_size'].includes(name))return fmtNumber(v);if(['featured','knockout','consent_marketing','is_completed'].includes(name))return v===true||String(v)==='true'?'<span class="badge published">Sí</span>':'<span class="cell-muted">No</span>';return `<div class="cell-truncate" title="${attr(v)}">${short(v,72)||'<span class="cell-muted">—</span>'}</div>`;}
function bindTable(def,r){
  $('#toggleFilters').onclick=()=>{state.filtersOpen=!state.filtersOpen;$('#filtersPanel').classList.toggle('hidden',!state.filtersOpen);};
  const search=()=>{state.query.search=$('#tableSearch').value.trim();state.query.page=1;showTable(def.key,true);};$('#applySearch').onclick=search;$('#tableSearch').addEventListener('keydown',e=>{if(e.key==='Enter')search();});
  $('#applyFilters')?.addEventListener('click',()=>{state.query.filters={};$$('[data-filter]').forEach(s=>{if(s.value)state.query.filters[s.dataset.filter]=s.value;});state.query.dateFrom=$('#dateFrom')?.value||'';state.query.dateTo=$('#dateTo')?.value||'';state.query.includeArchived=$('#includeArchived')?.value==='true';state.query.page=1;showTable(def.key,true);});
  $('#clearFilters')?.addEventListener('click',()=>{const search=state.query.search;resetQuery();state.query.search=search;showTable(def.key,true);});
  $('#pageSize').onchange=e=>{state.query.pageSize=Number(e.target.value);state.query.page=1;showTable(def.key,true);};$('#prevPage').onclick=()=>{if(state.query.page>1){state.query.page--;showTable(def.key,true);}};$('#nextPage').onclick=()=>{if(state.query.page<r.pages){state.query.page++;showTable(def.key,true);}};
  $('#checkAll').onchange=e=>{$$('.row-check').forEach(ch=>{ch.checked=e.target.checked;if(ch.checked)state.selected.add(ch.value);else state.selected.delete(ch.value);});updateBulk();};$$('.row-check').forEach(ch=>ch.onchange=()=>{ch.checked?state.selected.add(ch.value):state.selected.delete(ch.value);updateBulk();});
  $$('[data-action]').forEach(b=>b.onclick=()=>handleRowAction(def,b.dataset.action,b.dataset.id));$$('[data-bulk]').forEach(b=>b.onclick=()=>bulkAction(def,b.dataset.bulk));
}
function updateBulk(){$('#bulkBar')?.classList.toggle('hidden',!state.selected.size);if($('#selectedCount'))$('#selectedCount').textContent=state.selected.size;}
async function handleRowAction(def,action,id){const row=state.result.rows.find(r=>String(r[def.pk])===String(id));if(action==='view')return viewRecord(def,row);if(action==='edit')return openEditor(row);if(action==='duplicate')return mutate(()=>call('adminDuplicateData',[state.token,def.key,id]),'Registro duplicado');if(action==='archive')return confirmMutation('Dar de baja este registro?',()=>call('adminArchiveData',[state.token,def.key,id]),'Registro dado de baja');if(action==='restore')return mutate(()=>call('adminRestoreData',[state.token,def.key,id]),'Registro restaurado');if(action==='delete')return confirmMutation('Esta baja es definitiva. ¿Eliminar el registro?',()=>call('adminHardDeleteData',[state.token,def.key,id]),'Registro eliminado');}
async function mutate(fn,msg){busy(true);try{await fn();toast(msg);await showTable(state.tableKey,true);}catch(err){toast(err.message,'error');}finally{busy(false);}}
async function confirmMutation(question,fn,msg){if(!confirm(question))return;return mutate(fn,msg);}
async function bulkAction(def,action){const ids=Array.from(state.selected);if(!ids.length)return;if(!confirm(`Aplicar “${action}” a ${ids.length} registros?`))return;busy(true);try{await call('adminBulkAction',[state.token,def.key,ids,action]);state.selected.clear();toast('Operación masiva completada');await showTable(def.key,true);}catch(err){toast(err.message,'error');}finally{busy(false);}}

function openEditor(record){
  const def=state.workspace.tables[state.tableKey];const editing=!!record?.[def.pk];
  const editable=def.fields.filter(f=>!f.readOnly);const technical=def.fields.filter(f=>f.readOnly&&editing);
  openModal(`<div class="modal-title"><div class="eyebrow">${editing?'Modificación':'Alta'} · ${esc(def.label)}</div><h2>${editing?'Editar registro':'Nuevo registro'}</h2><p>${editing?'Actualizá los campos necesarios. La modificación quedará auditada.':'Completá los datos para crear el registro.'}</p></div><form id="dataForm"><div class="form-grid">${editable.map(f=>fieldHtml(f,record?.[f.name])).join('')}${technical.length?`<div class="form-section-title">Campos técnicos / solo lectura</div>${technical.map(f=>fieldHtml(f,record?.[f.name],true)).join('')}`:''}</div><div class="form-actions"><button type="button" class="btn" data-cancel>Cancelar</button><button type="submit" class="btn primary">${editing?'Guardar cambios':'Crear registro'}</button></div></form>`,true);
  $('[data-cancel]').onclick=closeModal;
  $('#dataForm').onsubmit=async e=>{e.preventDefault();const obj=formObject(def,e.target);busy(true);try{if(editing)await call('adminUpdateData',[state.token,def.key,record[def.pk],obj]);else await call('adminCreateData',[state.token,def.key,obj]);toast(editing?'Modificación guardada':'Alta creada');closeModal();await showTable(def.key,true);}catch(err){toast(err.message,'error');}finally{busy(false);}};
}
function fieldHtml(f,value,forceDisabled=false){const disabled=forceDisabled||f.readOnly;const full=['textarea','json'].includes(f.type);const note=disabled?'<small>solo lectura</small>':'';if(f.type==='boolean')return `<div class="field checkbox-field ${full?'full':''}"><input id="f_${attr(f.name)}" name="${attr(f.name)}" type="checkbox" ${value===true||String(value)==='true'?'checked':''} ${disabled?'disabled':''}><label for="f_${attr(f.name)}">${esc(f.label)}${note}</label></div>`;if(f.type==='select')return `<div class="field ${full?'full':''}"><label>${esc(f.label)}${note}</label><select name="${attr(f.name)}" ${disabled?'disabled':''}><option value=""></option>${(f.options||[]).map(o=>`<option value="${attr(o)}" ${String(o)===String(value??'')?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;if(['textarea','json'].includes(f.type))return `<div class="field full"><label>${esc(f.label)}${note}</label><textarea class="${f.type==='json'?'json':''}" name="${attr(f.name)}" ${disabled?'disabled':''}>${esc(formatFormValue(value,f.type))}</textarea></div>`;const type=f.type==='datetime'?'datetime-local':f.type==='number'?'number':f.type==='email'?'email':f.type==='tel'?'tel':f.type==='url'?'url':'text';return `<div class="field"><label>${esc(f.label)}${note}</label><input name="${attr(f.name)}" type="${type}" value="${attr(formatFormValue(value,f.type))}" ${disabled?'disabled':''}></div>`;}
function formatFormValue(v,type){if(isBlank(v))return '';if(type==='datetime'){const d=new Date(v);if(!Number.isNaN(d.getTime()))return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}if(type==='json'&&typeof v==='object')return JSON.stringify(v,null,2);return String(v);}
function formObject(def,form){const fd=new FormData(form),obj={};def.fields.filter(f=>!f.readOnly).forEach(f=>{if(f.type==='boolean')obj[f.name]=form.elements[f.name]?.checked||false;else{let v=fd.get(f.name);if(f.type==='json'&&v){try{JSON.parse(v);}catch(e){throw new Error(`${f.label}: JSON inválido`);}}obj[f.name]=v??'';}});return obj;}

async function viewRecord(def,row){if(def.special==='lead')return openLead360(row[def.pk]);if(def.special==='campaign')return openCampaign360(row.campaign_key);if(def.special==='onboarding')return openOnboarding360(row[def.pk]);return openGenericDetail(def,row);}
function openGenericDetail(def,row){openModal(`<div class="modal-title"><div class="eyebrow">Consulta · ${esc(def.label)}</div><h2>${esc(primaryTitle(def,row))}</h2><p>${esc(row[def.pk]||'')}</p></div><div class="detail-grid">${def.fields.map(f=>detailHtml(f,row[f.name])).join('')}</div>${def.permissions.write?`<div class="form-actions"><button class="btn primary" id="detailEdit">Modificar</button></div>`:''}`,true);if($('#detailEdit'))$('#detailEdit').onclick=()=>{closeModal();openEditor(row);};}
function primaryTitle(def,row){return row.name||row.title||row.company||row.company_name||row.full_name||row.campaign_key||row.slug||row[def.pk]||def.label;}
function detailHtml(f,v){const long=['json','textarea'].includes(f.type)||String(v??'').length>120;let html;if(f.type==='json'){let pretty=v;try{pretty=JSON.stringify(JSON.parse(v),null,2);}catch(e){}html=`<pre class="json-view">${esc(pretty||'—')}</pre>`;}else if(/_at$/.test(f.name)||f.type==='datetime')html=esc(fmtDate(v));else if(f.type==='boolean')html=(v===true||String(v)==='true')?'Sí':'No';else if(f.name==='status'||['classification','mailing_segment'].includes(f.name))html=badge(v);else html=esc(isBlank(v)?'—':v);return `<div class="detail-card ${long?'full':''}"><label>${esc(f.label)}</label><div>${html}</div></div>`;}

async function openCampaign360(key){busy(true);try{const r=await call('adminGetCampaign360',[state.token,key]);const c=r.campaign,s=r.stats;openModal(`<div class="modal-title"><div class="eyebrow">Campaña · Vista 360°</div><h2>${esc(c.name||c.campaign_key)}</h2><p>${esc(c.campaign_key)} · ${esc(c.landing_path||'Sin landing')} · ${esc(c.status||'')}</p></div><div class="kpi-row">${miniKpi('Leads',s.total)}${miniKpi('Completos',s.complete)}${miniKpi('Incompletos',s.incomplete)}${miniKpi('Conversión',s.conversion+'%')}${miniKpi('Calificados',s.qualified)}${miniKpi('Revisión',s.review)}${miniKpi('Recursos',s.resources)}${miniKpi('Clicks reunión',s.meetingClicks)}</div><div class="section-grid" style="margin-top:14px"><section class="panel col-4"><div class="panel-head"><h3>Fuentes</h3></div>${distribution(r.sources)}</section><section class="panel col-4"><div class="panel-head"><h3>Segmentos</h3></div>${distribution(r.segments)}</section><section class="panel col-4"><div class="panel-head"><h3>Mailings</h3></div>${distribution(r.mailingStatuses)}</section><section class="panel col-12"><div class="panel-head"><div><h3>Leads de la campaña</h3><p>La campaña se analiza igual que Galicia o cualquier campaña futura.</p></div></div>${simpleLeadTable(r.recentLeads)}</section></div><div class="form-actions"><button class="btn" id="campaignData">Abrir registro de campaña</button><button class="btn primary" id="campaignLeads">Filtrar leads de esta campaña</button></div>`,true);$$('[data-lead360]').forEach(b=>b.onclick=()=>openLead360(b.dataset.lead360));$('#campaignData').onclick=()=>{closeModal();showTable('campaigns').then(()=>{state.query.search=key;showTable('campaigns',true);});};$('#campaignLeads').onclick=()=>{closeModal();state.tableKey='leads';resetQuery();state.query.filters.campaign_key=key;showTable('leads',true);};}catch(err){toast(err.message,'error');}finally{busy(false);}}
function miniKpi(label,value){return `<div class="mini-kpi"><strong>${esc(value)}</strong><span>${esc(label)}</span></div>`;}
function distribution(obj){const entries=Object.entries(obj||{}).sort((a,b)=>b[1]-a[1]);if(!entries.length)return empty('Sin datos','Todavía no hay información.');const max=Math.max(...entries.map(x=>x[1]),1);return `<div class="distribution">${entries.map(([k,v])=>`<div class="distribution-row"><label title="${attr(k)}">${esc(k)}</label><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div><b>${v}</b></div>`).join('')}</div>`;}

async function openLead360(id){busy(true);try{const r=await call('adminGetLead360',[state.token,id]);const l=r.lead;openModal(`<div class="modal-title"><div class="eyebrow">Lead · Vista 360°</div><h2>${esc(l.company||l.full_name||l.email||'Lead')}</h2><p>${esc(l.email||'')} · ${esc(l.campaign_key||'Sin campaña')} · ${esc(l.source||'Sin origen')}</p></div><div class="kpi-row">${miniKpi('Estado',l.status||'—')}${miniKpi('Score',l.score_total||0)}${miniKpi('Clasificación',l.classification||'—')}${miniKpi('Segmento',l.mailing_segment||'—')}${miniKpi('Paso',l.current_step||1)}${miniKpi('Revisión',l.manual_review_status||'—')}</div><div class="section-grid" style="margin-top:14px"><section class="panel col-6"><div class="panel-head"><h3>Perfil y seguimiento</h3></div><div class="detail-grid">${['full_name','email','phone','company','website','owner','next_action_at','meeting_status','meeting_clicked_at','last_activity_at'].map(n=>{const f=state.workspace.tables.leads.fields.find(x=>x.name===n);return detailHtml(f||{name:n,label:human(n),type:'text'},l[n]);}).join('')}</div></section><section class="panel col-6"><div class="panel-head"><h3>Evaluación interna</h3></div><div class="detail-grid">${['stage','status','score_total','knockout','classification','benefit','mailing_segment','manual_review_status','utm_source','utm_medium','utm_campaign','referrer'].map(n=>{const f=state.workspace.tables.leads.fields.find(x=>x.name===n);return detailHtml(f||{name:n,label:human(n),type:'text'},l[n]);}).join('')}</div></section><section class="panel col-12"><div class="panel-head"><h3>Respuestas</h3></div>${relatedTable(r.answers,['question_key','answer_key','answer_text','score','knockout','updated_at'])}</section><section class="panel col-6"><div class="panel-head"><h3>Mailings</h3></div>${relatedTable(r.mailings,['sequence_no','template_key','segment','status','scheduled_at','sent_at'])}</section><section class="panel col-6"><div class="panel-head"><h3>Timeline</h3></div>${relatedTable(r.events,['event_type','source','page_path','created_at'])}</section></div><div class="form-actions"><button class="btn primary" id="leadEdit">Modificar lead</button></div>`,true);$('#leadEdit').onclick=()=>{closeModal();state.tableKey='leads';openEditor(l);};}catch(err){toast(err.message,'error');}finally{busy(false);}}
function relatedTable(rows,cols){if(!rows.length)return empty('Sin registros','No hay datos relacionados todavía.');return `<div class="table-shell"><table class="data-table"><thead><tr>${cols.map(c=>`<th>${esc(human(c))}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${cellValue(c,r[c])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}

async function openOnboarding360(id){busy(true);try{const r=await call('adminGetOnboarding360',[state.token,id]);const o=r.onboarding,d=r.data||{},fd=d.formData||d;const questions=Object.keys(fd||{}).filter(k=>/^q\d+$/.test(k)).sort((a,b)=>Number(a.slice(1))-Number(b.slice(1)));openModal(`<div class="modal-title"><div class="eyebrow">Onboarding · Legajo 360°</div><h2>${esc(o.company_name||o.cuit||'Onboarding')}</h2><p>${esc(o.contact_name||'')} · ${esc(o.email||'')} · ${badge(o.status)}</p></div><div class="kpi-row">${miniKpi('Paso',o.current_step||1)}${miniKpi('Completado',String(o.is_completed)==='true'||o.is_completed===true?'Sí':'No')}${miniKpi('Condición fiscal',o.taxpayer_type||'—')}${miniKpi('Actualizado',fmtDate(o.updated_at))}</div><div class="section-grid" style="margin-top:14px"><section class="panel col-12"><div class="panel-head"><h3>Datos del legajo</h3></div><div class="detail-grid">${Object.entries(fd||{}).filter(([k])=>!/^q\d+$/.test(k)).map(([k,v])=>`<div class="detail-card ${String(v??'').length>100?'full':''}"><label>${esc(human(k))}</label><div>${esc(isBlank(v)?'—':v)}</div></div>`).join('')||'<div class="cell-muted">Sin datos adicionales</div>'}</div></section>${questions.length?`<section class="panel col-12"><div class="panel-head"><h3>Respuestas estratégicas</h3></div><div class="detail-grid">${questions.map(k=>`<div class="detail-card full"><label>${esc(k.toUpperCase())}</label><div>${esc(fd[k])}</div></div>`).join('')}</div></section>`:''}<section class="panel col-12"><div class="panel-head"><h3>JSON normalizado</h3></div><pre class="json-view">${esc(JSON.stringify(d,null,2))}</pre></section></div><div class="form-actions"><button class="btn primary" id="onbEdit">Modificar legajo</button></div>`,true);$('#onbEdit').onclick=()=>{closeModal();state.tableKey='onboarding';openEditor(o);};}catch(err){toast(err.message,'error');}finally{busy(false);}}

function openMediaUpload(){openModal(`<div class="modal-title"><div class="eyebrow">Alta · Media</div><h2>Subir imagen</h2><p>El archivo se guarda en Drive y se registra automáticamente en CMS_Media.</p></div><div class="upload-drop"><input id="mediaFile" type="file" accept="image/*"></div><div class="form-grid" style="margin-top:12px"><div class="field"><label>Texto alternativo</label><input id="mediaAlt" placeholder="Descripción accesible"></div><div class="field"><label>Tipo relacionado</label><input id="mediaEntityType" placeholder="blog, team, case…"></div><div class="field"><label>ID relacionado</label><input id="mediaEntityId" placeholder="Opcional"></div><div class="field"><label>Orden</label><input id="mediaSort" type="number" value="0"></div></div><div class="form-actions"><button class="btn" data-cancel>Cancelar</button><button id="mediaUploadBtn" class="btn primary">Subir</button></div>`);$('[data-cancel]').onclick=closeModal;$('#mediaUploadBtn').onclick=uploadMedia;}
async function uploadMedia(){const f=$('#mediaFile').files[0];if(!f)return toast('Elegí una imagen','error');if(f.size>8*1024*1024)return toast('Máximo 8 MB','error');busy(true);try{const base64=await fileToDataUrl(f);await call('uploadMediaAdmin',[state.token,{fileName:f.name,mimeType:f.type,base64,altText:$('#mediaAlt').value,entityType:$('#mediaEntityType').value,entityId:$('#mediaEntityId').value,sortOrder:$('#mediaSort').value}]);toast('Imagen subida');closeModal();showTable('media',true);}catch(err){toast(err.message,'error');}finally{busy(false);}}
function fileToDataUrl(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file);});}
function empty(title,copy){return `<div class="empty-state"><b>${esc(title)}</b>${esc(copy)}</div>`;}
function errorState(err){return `<div class="panel">${empty('No pudimos cargar esta vista',err.message||String(err))}</div>`;}

boot();
</script>
